name: tests

# The steps call Makefile targets: `make` locally runs the same checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  perf-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install strace
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q strace
      - name: perf (bash 5)
        run: make perf
      - name: perf (bash 3.2)
        run: make perf-bash32

  perf-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # /bin/bash is the stock 3.2; `bash` in PATH can be Homebrew bash 5.
      # Covers the BSD date/stat paths and the Keychain branch.
      - name: perf (macOS /bin/bash)
        env:
          PERF_BASH: /bin/bash
        run: make perf
